name: Liberty Infinity MPC and Mac Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mpc:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: inmusic-software/mpc-plugin-builder-sdk
          ref: e78bad508a305a92443758eb2bc8b428e9e7a687
          path: sdk
      - run: pip install pillow numpy
      - run: python tools/generate_samples.py
      - run: python tools/pack_factory.py
      - run: python tools/retro_assets.py
      - run: python tools/enable_sdk_threads.py
      - run: python sdk/tools/build.py plugins/Infinity --target native
      - run: c++ -std=c++17 -O2 -pthread -I sdk/framework tests/factory.cpp -o /tmp/infinity-test -ldl
      - run: set -o pipefail; MPC_PLUGIN_FOLDER="$PWD/plugins/Infinity" /tmp/infinity-test | tee factory-validation.txt
      - run: python tools/make_retro_skin.py
      - run: python tools/enable_sdk_threads.py
      - run: python sdk/tools/build.py plugins/Infinity
      - run: python sdk/tools/package.py plugins/Infinity
      - uses: actions/upload-artifact@v4
        with:
          name: Liberty-Infinity-MPC-v0.6.0-EXPERIMENTAL
          path: plugins/Infinity/dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Liberty-Infinity-v0.6.0-Factory-Validation
          path: factory-validation.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Liberty-Infinity-Black-Gold-Browser-Pro-Preview
          path: plugins/Infinity/assets/black-gold-preview.png
          if-no-files-found: error
  mac-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: inmusic-software/mpc-plugin-builder-sdk
          ref: e78bad508a305a92443758eb2bc8b428e9e7a687
          path: sdk
      - run: pip install pillow numpy
      - run: python tools/generate_samples.py
      - run: python tools/pack_factory.py
      - run: python tools/retro_assets.py
      - run: bash macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Liberty-Infinity-Mac-Test-v0.6.0-arm64
          path: dist/*.zip
          if-no-files-found: error
